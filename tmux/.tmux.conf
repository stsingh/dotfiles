set -g prefix C-Space
unbind C-b
bind C-Space send-prefix
setw -g mode-keys vi
set-option -g set-clipboard on
set-option -g escape-time 10

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Escape send-keys -X canceli

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/sensible'

# ~/.tmux.conf — Tomorrow Night status bar

# Status bar colors
set -g status-style "bg=#1d1f21,fg=#c5c8c6"

# Left: session name
set -g status-left "#[bg=#373b41,fg=#c5c8c6] #S #[default] "
set -g status-left-length 20

# Right: date + time
set -g status-right "#[bg=#373b41,fg=#c5c8c6] %Y-%m-%d %H:%M #[default]"

# Windows
set -g window-status-format " #I:#W "
set -g window-status-style "bg=#1d1f21,fg=#969896"

# Active window — blue accent
set -g window-status-current-format " #I:#W "
set -g window-status-current-style "bg=#81a2be,fg=#1d1f21,bold"

# Pane borders
set -g pane-border-style "fg=#373b41"
set -g pane-active-border-style "fg=#81a2be"

# Message bar
set -g message-style "bg=#373b41,fg=#c5c8c6"
